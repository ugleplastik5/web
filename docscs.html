<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGNILO SHOP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <section class="hero">
        <h1>Спортивное питание</h1>
        <p>не накачаешься а станешь жирным</p>
        <a href="#order" class="btn">Заказать </a>
    </section>

    <section class="benefits">
        <div class="benefit">
            <h3>Чистый состав</h3>
            <p>С сахарОМ и другими ядерными отходами</p>
        </div>
        <div class="benefit">
            <h3>долгая доставка</h3>
            <p>От 2 до 7 лет</p>
        </div>
        <div class="benefit">
            <h3>Провереное качество</h3>
            <p>Есть официальные лицензии</p>
        </div>
    </section>

    <section id="order" class="order">
        <h2>Вы не можете оставить заявку</h2>
        <form>
            <input type="text" placeholder="Имя" required>
            <input type="tel" placeholder="Телефон" required>
            <button type="submit" class="btn">Отправить</button>
        </form>
    </section>
</body>
</html>
